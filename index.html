<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>random BG color</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section>
        <form action="#">
            Red:<input class="rRange" type="range" min="0" max="255" value="0">
            Green:<input class="gRange" type="range" min="0" max="255" value="0">
            Blue:<input class="bRange" type="range" min="0" max="255" value="0">
            <hr>
            <input class="random" type="submit" value="Random Background Color">
        </form>
    </section>
    <script src="script.js"></script>
</body>
</html>
